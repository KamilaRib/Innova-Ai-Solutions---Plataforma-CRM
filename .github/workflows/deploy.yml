name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build
        run: |
          npm install
          # Note: postinstall in root root handles backend install, frontend install and frontend build

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # Excluindo node_modules para evitar lentidão extrema no FTP.
          # A Hostinger (Passenger) lidará com as dependências do servidor.
          exclude: |
            **/.git*
            **/.github*
            **/node_modules/**
            frontend/src/**
            frontend/public/**
            frontend/*.json
            frontend/*.js
            frontend/*.config.js
            docs/**
            .agents/**
            .superpowers/**
            .worktrees/**
            README.md
            task  crm
            backend_phase*
