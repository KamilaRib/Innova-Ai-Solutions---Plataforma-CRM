version: '3.7'

services:
  evolution_api:
    image: atendai/evolution-api:latest
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - DOCKER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=innova_secret_key
      
      # Database Config
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:pass@postgres:5432/evolution?sslmode=disable
      
      # Redis Config
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/0
      - CACHE_REDIS_DB=0
      
      - STORE_MESSAGES=true
      - STORE_MESSAGE_UPON_CREATION=true
    depends_on:
      - redis
      - postgres
    networks:
      - evolution_network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution_network

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    networks:
      - evolution_network

volumes:
  postgres_data:

networks:
  evolution_network:
    driver: bridge
